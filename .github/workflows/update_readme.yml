name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update_readme.yml"
      - ".github/stats/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install stats renderer
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/stats

      - name: Check project star aggregation
        run: npm test
        working-directory: .github/stats

      - name: Generate stats card
        run: npm run generate
        working-directory: .github/stats
        env:
          PAT_1: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          if git diff --cached --quiet; then
            echo "Stats card is already up to date."
            exit 0
          fi
          git commit -m "chore: update README stats card"
          git push origin HEAD:main
